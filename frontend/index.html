<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard-Go</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Window Titlebar / Drag Handle -->
        <header class="header" data-wails-drag>
            <div class="header-top">
                <div class="brand">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        </svg>
                    </div>
                    <span class="brand-title">Clipboard-Go</span>
                </div>
                
                <div class="header-actions" data-wails-no-drag>
                    <button id="btn-incognito" class="icon-btn" title="Toggle Incognito Mode (Pause recording)">
                        <svg class="incognito-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="incognito-on-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                    <button id="btn-clear" class="icon-btn danger-hover" title="Clear Unpinned History">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                    <button id="btn-close" class="icon-btn" title="Close (Esc)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-container" data-wails-no-drag>
                <div class="search-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search clipboard history... (↑↓ navigate, Enter paste)" autofocus autocomplete="off">
                    <button id="btn-clear-search" class="clear-search-btn hidden">✕</button>
                </div>
            </div>

            <!-- Category Filter Pills -->
            <div class="filter-bar" data-wails-no-drag>
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="pinned">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    Pinned
                </button>
                <button class="filter-pill" data-filter="text">Text</button>
                <button class="filter-pill" data-filter="image">Images</button>
            </div>
        </header>

        <!-- Incognito Banner -->
        <div id="incognito-banner" class="incognito-banner hidden">
            <span>🛡 Incognito Mode Active — Recording paused</span>
        </div>

        <!-- History Item List -->
        <main class="list-container">
            <div id="item-list" class="item-list">
                <!-- Items populated dynamically -->
            </div>

            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">📋</div>
                <h3>No items found</h3>
                <p>Copied items will automatically appear here.</p>
            </div>
        </main>

        <!-- Keyboard Hint Footer -->
        <footer class="footer" data-wails-drag>
            <div class="shortcut-hints">
                <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
                <span><kbd>↵</kbd> paste</span>
                <span><kbd>P</kbd> pin</span>
                <span><kbd>Del</kbd> delete</span>
                <span><kbd>Esc</kbd> hide</span>
            </div>
        </footer>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <span id="toast-message">Item pasted</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
